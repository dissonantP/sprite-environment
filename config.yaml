# Sprite Environment Configuration
# These defaults can be overridden per-project or per-run.
# Any key can also be set via CLI: --key value (e.g. --install_docker false)

# ── Sprite ─────────────────────────────────────────────
# Name of the sprite to create/update (also settable via --name)
sprite_name:

# ── Codex ──────────────────────────────────────────────
# Install OpenAI Codex CLI and copy auth config
install_codex: true

# Local path to Codex auth file (copied into the sprite)
codex_auth_file: $HOME/.codex/auth.json

# Codex model to configure. When blank, inherit the top-level model from the
# local ~/.codex/config.toml.
codex_model:

# Local file-backed Codex MCP OAuth credential store. The Vercel installer
# extracts and copies only Vercel's credential record.
codex_mcp_credentials_file: $HOME/.codex/.credentials.json

# ── Docker ─────────────────────────────────────────────
# Install Docker Engine and Compose plugin
install_docker: false

# ── OpenSSH ────────────────────────────────────────────
# Install OpenSSH server and create sshd sprite service
install_openssh: false

# ── Cheatsheet ─────────────────────────────────────────
# Install ~/CHEATSHEET.md with optional component notes
install_cheatsheet: false

# ── Yarn ────────────────────────────────────────────────
# Install Yarn package manager globally
install_yarn: true

# Log into ghcr.io using gh auth token (requires install_gh: true)
docker_ghcr_login: true

# GitHub username for ghcr.io login
docker_ghcr_user: proteanP

# ── GitHub CLI ─────────────────────────────────────────
# Copy broad gh authentication and a personal SSH key to the Sprite.
# This is disabled because a --yolo agent could read those credentials.
install_gh: false

# Local SSH private key to upload (public key derived by appending .pub)
gh_ssh_key: $HOME/.ssh/id_ed25519

# ── Repo ───────────────────────────────────────────────
# Clone a GitHub repo after setup (e.g. owner/repo)
# Can be overridden with --repo CLI arg
repo:

# With repo set, generate a key inside the Sprite and use the local gh CLI to
# register its public key as a write-enabled deploy key for only that repo.
configure_repo_deploy_key: true

# ── Playwright MCP ─────────────────────────────────────
# Install Playwright MCP server and register with Codex
install_playwright_mcp: true

# ── Vercel MCP ─────────────────────────────────────────
# Register Vercel's remote MCP and copy its OAuth credentials
install_vercel_mcp: false
vercel_mcp_url: https://mcp.vercel.com
